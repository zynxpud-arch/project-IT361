<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركز فعاليات الحرم الجامعي | عن النادي</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <div class="logo">
            <h1>مركز الفعاليات</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">الرئيسية</a></li>
                <li><a href="events.html">الفعاليات</a></li>
                <li><a href="register.html">التسجيل</a></li>
                <li><a href="registrations.html">قائمة المسجلين</a></li>
                <li><a href="about.html" class="active">عن النادي</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="team-section">
            <h2>فريق العمل</h2>
            <div class="team-grid">
                <div class="team-member">
                    <h3>الطالب الأول</h3>
                    <p>الرقم الجامعي:  s220017100 </p>
                    <p>مطور الواجهة الأمامية HTML</p>
                </div>
                <div class="team-member">
                    <h3>الطالب الثاني</h3>
                    <p>الرقم الجامعي: S230061332 </p>
                    <p>مطور الواجهة الخلفية </p>
                </div>
            </div>
        </section>

        <section class="contact-section">
            <h2>تواصل معنا</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="contact-name">الاسم:</label>
                    <input type="text" id="contact-name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="contact-email">البريد الإلكتروني:</label>
                    <input type="email" id="contact-email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="message">الرسالة:</label>
                    <textarea id="message" name="message" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn">إرسال الرسالة</button>
            </form>
        </section>
    </main>

    <footer>
        <p> نادي الحاسب والذكاء الاصطناعي </p>
    </footer>

</body>
</html>
